services:
  backend:
    build: ./backend
    # Seeds sample data on first start (skipped if the database already has leads).
    command: sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: sqlite:////data/leadflow.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - leadflow-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  leadflow-data:
